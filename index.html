<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px 16px;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 20px;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #taskInput {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #taskInput:focus {
      outline: 2px solid #3d7bfd;
      border-color: #3d7bfd;
    }

    button {
      font-size: 15px;
      cursor: pointer;
    }

    .add-btn {
      padding: 10px 16px;
      background: #3d7bfd;
      color: #fff;
      border: none;
      border-radius: 4px;
    }

    .add-btn:hover {
      background: #2b63d9;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .task-text {
      flex: 1;
      word-break: break-word;
    }

    /* зачёркнутая задача */
    .done .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #d33;
      font-size: 18px;
      padding: 4px 8px;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Список задач</h1>

    <div class="form">
      <input type="text" id="taskInput" placeholder="Новая задача">
      <button class="add-btn" id="addBtn">Добавить</button>
    </div>

    <ul id="taskList"></ul>
    <p class="empty" id="emptyText">Список задач пустой</p>
  </div>

  <script>
    // массив, в котором хранятся все задачи
    let tasks = [];

    const input = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('taskList');
    const emptyText = document.getElementById('emptyText');

    // рисуем список заново
    function render() {
      list.innerHTML = '';

      // если задач нет — показываем текст
      if (tasks.length === 0) {
        emptyText.style.display = 'block';
        return;
      }
      emptyText.style.display = 'none';

      for (let i = 0; i < tasks.length; i++) {
        const task = tasks[i];

        const li = document.createElement('li');
        if (task.done) {
          li.classList.add('done');
        }

        // галочка "выполнено"
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', function () {
          task.done = checkbox.checked;
          render();
        });

        // текст задачи
        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        // кнопка удаления
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.title = 'Удалить задачу';
        delBtn.addEventListener('click', function () {
          tasks.splice(i, 1);
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
      }
    }

    function addTask() {
      const text = input.value.trim();

      if (text === '') {
        return; // пустые задачи не добавляем
      }

      tasks.push({ text: text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    addBtn.addEventListener('click', addTask);

    // добавление по Enter
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTask();
      }
    });

    render();
  </script>

</body>
</html>
